plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.+'
}

group = project.mavenGroup
version = project.mod_version

base {
    archivesName = project.archivesBaseName
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://cursemaven.com')
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "curse.maven:midnightcontrols-621768:7378068"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_description', project.mod_description
    inputs.property 'mod_author', project.mod_author
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'mod_name': project.mod_name,
               'mod_description': project.mod_description,
               'mod_author': project.mod_author
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

task curseforgePublish {
    dependsOn 'build'
    doLast {
        println "\nTo publish to CurseForge:"
        println "1. Set CURSEFORGE_API_TOKEN in gradle.properties or as an environment variable"
        println "2. Run: ./gradlew publishCurseforge"
        println "\nTo publish to Modrinth:"
        println "1. Set MODRINTH_TOKEN in gradle.properties or as an environment variable"
        println "2. Run: ./gradlew modrinth"
    }
}
